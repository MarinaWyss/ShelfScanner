[project]
name = "shelfscanner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MarinaWyss", email = "marina.bennett.wyss@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.3.0",
    "fastapi>=0.141.1",
    "google-genai>=2.22.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.7.0",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
shelfscanner = "shelfscanner:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
