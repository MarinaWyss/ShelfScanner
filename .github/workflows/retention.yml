# Change 008, task 3: the photo retention job. Runs daily here, not as a Vercel
# cron (010 kept it here). Deletes bucket objects for unlabelled photos older than the
# window (default 30 days, SHELFSCANNER_RETENTION_DAYS) and nulls their
# storage_path; labelled test-set photos are never touched.
name: retention

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  retain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Run retention
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SHELFSCANNER_RETENTION_DAYS: ${{ vars.SHELFSCANNER_RETENTION_DAYS }}
        run: uv run shelfscanner photos retain ${{ inputs.dry_run == true && '--dry-run' || '' }}
