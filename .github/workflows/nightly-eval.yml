# Change 006, task 3: the primaries over every labelled photo, nightly, then the regression
# check against research/baseline.json. Needs the Supabase secrets, the provider keys the
# primaries use, and a spend cap. Skipped silently until the secrets exist.
name: Nightly eval

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      set:
        description: "photo set for the check: core, sourced, derived"
        default: "core"

jobs:
  eval:
    runs-on: ubuntu-latest
    if: ${{ vars.NIGHTLY_EVAL == '1' }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SHELFSCANNER_SPEND_CAP_USD: ${{ vars.SHELFSCANNER_SPEND_CAP_USD || '15' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: The eval (reading over every labelled photo, choosing over the set, then the check)
        run: uv run python -m research.eval --set ${{ github.event.inputs.set || 'core' }} --reading-set all | tee -a "$GITHUB_STEP_SUMMARY"
