<title>ShelfScanner MVP Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root { color-scheme: light; --paper: #f3f4f1; --paper-2: #e9ebe6; --ink: #181b19; --ink-2: #565d59; --ink-3: #8b928e; --accent: #23694f; --accent-soft: #dcebe3; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --paper: #171917; --paper-2: #202321; --ink: #eceeea; --ink-2: #b3bab5; --ink-3: #7d857f; --accent: #5fb894; --accent-soft: #1d3a2e; } }
:root[data-theme="dark"] { color-scheme: dark; --paper: #171917; --paper-2: #202321; --ink: #eceeea; --ink-2: #b3bab5; --ink-3: #7d857f; --accent: #5fb894; --accent-soft: #1d3a2e; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Source Serif 4", Georgia, serif; font-size: 17px; line-height: 1.5; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 40px 24px 64px; }
.eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
h1 { font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif; font-size: clamp(30px, 4.5vw, 44px); line-height: 1.05; margin: 6px 0 24px; letter-spacing: -0.01em; }
figure { margin: 0; }
figure svg { width: 100%; height: auto; display: block; font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
figcaption { font-size: 15px; color: var(--ink-2); max-width: 70ch; margin-top: 20px; }
</style>

<div class="wrap">
  <div class="eyebrow">ShelfScanner · change 001</div>
  <h1>ShelfScanner MVP Pipeline</h1>

  <figure>
    <svg viewBox="0 0 1000 330" role="img" aria-label="A shelf photo goes to a vision model, which produces a list of titles. The titles and the reader's preferences go to a language model, which produces five picks with reasons. Every model call is logged and scored against hand labels." style="color: var(--ink);">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
        </marker>
      </defs>

      <g font-size="14" text-anchor="middle">
        <!-- Photo -->
        <rect x="20" y="110" width="150" height="70" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <text x="95" y="141" fill="currentColor">Shelf photo</text>
        <text x="95" y="161" fill="var(--ink-2)" font-size="12">from a phone</text>

        <!-- Vision model -->
        <rect x="225" y="110" width="160" height="70" rx="3" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.8"/>
        <text x="305" y="141" fill="currentColor" font-weight="500">Vision model</text>
        <text x="305" y="161" fill="var(--ink-2)" font-size="12">reads the spines</text>

        <!-- Titles -->
        <rect x="440" y="110" width="140" height="70" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <text x="510" y="141" fill="currentColor">Titles</text>
        <text x="510" y="161" fill="var(--ink-2)" font-size="12">what is on the shelf</text>

        <!-- Language model -->
        <rect x="635" y="110" width="160" height="70" rx="3" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.8"/>
        <text x="715" y="141" fill="currentColor" font-weight="500">Language model</text>
        <text x="715" y="161" fill="var(--ink-2)" font-size="12">chooses five</text>

        <!-- Picks -->
        <rect x="850" y="110" width="130" height="70" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <text x="915" y="141" fill="currentColor">Five picks</text>
        <text x="915" y="161" fill="var(--ink-2)" font-size="12">each with a reason</text>

        <!-- Preferences -->
        <rect x="645" y="15" width="140" height="50" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <text x="715" y="38" fill="currentColor">Preferences</text>
        <text x="715" y="55" fill="var(--ink-2)" font-size="12">genres, likes, avoids</text>
      </g>

      <!-- Flow arrows -->
      <g fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)">
        <line x1="170" y1="145" x2="223" y2="145"/>
        <line x1="385" y1="145" x2="438" y2="145"/>
        <line x1="580" y1="145" x2="633" y2="145"/>
        <line x1="795" y1="145" x2="848" y2="145"/>
        <line x1="715" y1="65" x2="715" y2="108"/>
      </g>

      <!-- Logging and scoring band -->
      <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)">
        <line x1="305" y1="180" x2="305" y2="243"/>
        <line x1="715" y1="180" x2="715" y2="243"/>
      </g>
      <rect x="225" y="245" width="570" height="62" rx="3" fill="var(--paper-2)" stroke="currentColor" stroke-width="1" opacity=".9"/>
      <text x="510" y="272" font-size="13" fill="currentColor" text-anchor="middle">Every call logged: model, cost, latency, output</text>
      <text x="510" y="292" font-size="12" fill="var(--ink-2)" text-anchor="middle">scored against hand labels · compared in the report</text>
    </svg>
    <figcaption>Two model calls, each swappable through a config entry. The vision model turns a photo into a title list; the language model turns that list plus preferences into five picks with reasons. Both are logged and scored against hand-labelled shelves, which is how the models were compared.</figcaption>
  </figure>
</div>
