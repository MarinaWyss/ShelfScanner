# Models, stages and pipeline settings (001 D10, D13; 002 D4, D5, D6, D8).
#
# Each model names an `adapter` (default "openrouter") and, for a direct
# adapter, the provider's own `model_id`. `slug` is the OpenRouter slug and is
# what the `model` columns log, so rows from change 001 stay comparable.
# Prices are USD per million tokens, input / output; direct adapters compute
# cost from them (reasoning priced as output), OpenRouter reports its own.
#
# Slugs checked against https://openrouter.ai/api/v1/models on 2026-09-02.
# Anthropic prices also match the Claude API reference cached 2026-06-24.

[settings]
# Sequence-ratio threshold for fuzzy title matching (proposal D3).
match_threshold = 0.85
# Default long edge in pixels for images sent to a vision model (proposal D7).
default_max_edge = 1568
# `report` warns when the prices are older than 90 days (002 D5).
prices_checked = 2026-09-02
# The spend guard sums cost_usd over the runs tables from this date (002 task 0).
spend_since = 2026-09-02

# Which model serves each stage, with a fallback used on provider error,
# timeout or truncation (002 D8). Changing a model is an edit here plus
# `uv run python -m research.check` (002 D6).
[stages.reading]
primary = "gemini-flash"
fallback = "sonnet"

[stages.choosing]
primary = "gpt-mini"
fallback = "qwen-flash"

[models.haiku]
slug = "anthropic/claude-haiku-4.5"
adapter = "anthropic"
model_id = "claude-haiku-4-5"
provider = "Anthropic"
price_input = 1.00
price_output = 5.00

[models.sonnet]
slug = "anthropic/claude-sonnet-5"
adapter = "anthropic"
model_id = "claude-sonnet-5"
provider = "Anthropic"
price_input = 2.00
price_output = 10.00

[models.gpt-mini]
# The proposal said "GPT-5 mini or current small model". gpt-5-mini is still
# listed ($0.25 / $2.00) but gpt-5.4-mini is the current one.
slug = "openai/gpt-5.4-mini"
provider = "OpenAI"
adapter = "openai"
model_id = "gpt-5.4-mini"
price_input = 0.75
price_output = 4.50

[models.gemini-flash]
# The proposal said "Gemini Flash-Lite or current Flash". gemini-2.5-flash-lite
# is still listed ($0.10 / $0.40) but gemini-3.8-flash is the current Flash;
# gemini-3.5-flash-lite ($0.30 / $2.50) is the current Lite if a cheaper
# fallback is wanted later.
slug = "google/gemini-3.8-flash"
adapter = "google"
model_id = "gemini-3.8-flash"
provider = "Google"
price_input = 0.75
price_output = 3.75

[models.qwen-flash]
# Fifth candidate, added 2026-09-02 at Marina's request. The current Qwen
# flash tier with image input; qwen3.8-27b ($0.42 / $2.55) is the next size up.
# With its default reasoning it spent the whole 4096-token output budget
# thinking on 3 of 5 photos and never wrote the JSON; "low" still did on 2 of
# 5. "none" switches thinking off (0 reasoning tokens) and it then reads the
# shelf fine. Gemini 3.8 Flash has the same tendency but finished within
# budget, so it is left at its default; the same key applies if cost or
# latency matter.
slug = "qwen/qwen3.8-flash"
provider = "Alibaba"
price_input = 0.15
price_output = 0.47
reasoning_effort = "none"
