{% extends "base.html" %}
{% set page = 'scan' %}
{% block content %}
  <h1>ShelfScanner</h1>
  <p class="lede">Photograph a shelf. The books on it are read, and five are picked for you.</p>

  <form id="scan-form" hx-post="/scan" hx-encoding="multipart/form-data" hx-target="#scan" hx-swap="innerHTML">
    <label class="picker">
      Take or choose a shelf photo
      <input type="file" name="photo" accept="image/*" required>
    </label>
    <input type="hidden" name="resized" value="0">
    <button type="submit" id="scan-button">Read the shelf</button>
  </form>

  <section id="scan" aria-live="polite"></section>
{% endblock %}
{% block scripts %}<script src="/static/app.js"></script>{% endblock %}
