<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="AI Book Recommendations - Identify books from bookshelf photos and get personalized recommendations based on your preferences.">
<title>{% block title %}ShelfScanner - AI Book Recommendations{% endblock %}</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<script>
  // 016: the stored choice wins, else the system setting; set before first paint so nothing flashes.
  (function () { var t; try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') { t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    document.documentElement.dataset.theme = t; })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Domine:wght@500;600;700&family=Karla:wght@400;500;600;700&display=swap">
<style>
  /* 015: the "ShelfScanner Warm Redesign" tokens, type and surfaces on the v1 structure (014):
     paper and olive, Domine for headings, Karla for everything else, hatched paper-deep cards,
     brass-ruled small-caps labels. The dark set is derived: the same hues on an ink-dark paper. */
  :root { color-scheme: light;
          --paper: #f6f0e2; --paper-deep: #ece0c4; --ink: #2b2620; --muted: #6f6a58; --line: #d8c9a0;
          --olive: #47532f; --olive-dark: #363f24; --moss: #6b7a49; --sage: #a9b48a; --terracotta: #a8502f;
          --brass: #b4863a; --cream: #faf6ec; --surface: #faf6ec; --hatch: rgba(43,38,32,.035); --olive-text: #363f24;
          --brass-tint: rgba(180,134,58,.16); --terracotta-tint: rgba(168,80,47,.1); --overlay: rgba(43,38,32,.45);
          --serif: 'Domine', Georgia, 'Times New Roman', serif;
          --sans: 'Karla', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  :root[data-theme="dark"] { color-scheme: dark;
            --paper: #1d1a15; --paper-deep: #2a261e; --ink: #efe7d6; --muted: #b5ac98; --line: #4b4433;
            --olive: #5c6c3d; --olive-dark: #47532f; --moss: #7f8f5c; --sage: #8c9770; --terracotta: #d0765a;
            --brass: #c99a4a; --cream: #faf6ec; --surface: #23201a; --hatch: rgba(250,246,236,.03); --olive-text: #b9c49a;
            --brass-tint: rgba(201,154,74,.18); --terracotta-tint: rgba(196,102,74,.14); --overlay: rgba(0,0,0,.55); }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased;
         font: 16px/1.5 var(--sans); }
  a { color: var(--olive-text); }
  a:hover { color: var(--terracotta); }
  h1, h2, h3, h4 { margin: 0; line-height: 1.25; font-family: var(--serif); font-weight: 600; letter-spacing: -.005em; }
  p { margin: 0; }
  svg.i { width: 1.25rem; height: 1.25rem; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg.i.s { width: 1rem; height: 1rem; }
  .paper { background-color: var(--paper-deep); background-image: repeating-linear-gradient(115deg, var(--hatch) 0 1px, transparent 1px 3px); }

  /* header and the drawer */
  header { position: sticky; top: 0; z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
  .bar { padding: .9rem 1rem; display: flex; align-items: center; justify-content: space-between; }
  @media (min-width: 640px) { .bar { padding: .9rem 1.5rem; } }
  @media (min-width: 1024px) { .bar { padding: .9rem 2rem; } }
  .bar .left, .bar .right { display: flex; align-items: center; gap: 1rem; }
  .icon-btn { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: .5rem; font: inherit; font-size: .875rem; font-weight: 600; text-decoration: none; }
  .icon-btn:hover { color: var(--terracotta); }
  .brand { display: inline-flex; align-items: center; gap: .55rem; text-decoration: none; color: var(--ink); font-family: var(--serif); font-size: 1.2rem; font-weight: 600; }
  .brand:hover { color: var(--ink); }
  .brand svg.i { width: 1.6rem; height: 1.6rem; }
  .bar .right .label { display: none; }
  #theme-toggle .sun, #theme-toggle .to-light { display: none; }
  :root[data-theme="dark"] #theme-toggle .sun, :root[data-theme="dark"] #theme-toggle .to-light { display: inline; }
  :root[data-theme="dark"] #theme-toggle .moon, :root[data-theme="dark"] #theme-toggle .to-dark { display: none; }
  @media (min-width: 768px) { .bar .right .label { display: inline; } }
  aside.drawer { position: fixed; top: 61px; bottom: 0; left: 0; z-index: 20; width: 16rem; background: var(--paper); border-right: 1px solid var(--line);
                 transform: translateX(-100%); transition: transform .3s ease-in-out; display: flex; flex-direction: column; }
  body.drawer-open aside.drawer { transform: none; }
  .overlay { position: fixed; inset: 0; z-index: 10; background: var(--overlay); display: none; }
  body.drawer-open .overlay { display: block; }
  .drawer ul { list-style: none; margin: 0; padding: .6rem; display: grid; gap: .25rem; }
  .drawer a { display: flex; align-items: center; gap: .6rem; padding: .5rem .75rem; border-radius: .5rem; font-size: .9rem; font-weight: 600; text-decoration: none; color: var(--muted); }
  .drawer a:hover { background: var(--paper-deep); color: var(--ink); }
  .drawer a[aria-current] { background: var(--paper-deep); color: var(--olive-text); }

  /* page frame */
  main { max-width: 72rem; margin: 0 auto; padding: 1.5rem; }
  @media (min-width: 640px) { main { padding: 2rem; } }
  @media (min-width: 1024px) { main { padding: 2.5rem; } }
  .page-title { font-size: 1.85rem; margin-bottom: .5rem; }
  .page-lede { color: var(--muted); font-size: 1.05rem; }
  .muted, .lede { color: var(--muted); }
  .lede { margin-bottom: 1.25rem; }
  .small { font-size: .875rem; }
  .xs { font-size: .75rem; }

  /* cards and buttons */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: .75rem; }
  .card.gray { background-color: var(--paper-deep); background-image: repeating-linear-gradient(115deg, var(--hatch) 0 1px, transparent 1px 3px); border-color: transparent; }
  .card .body { padding: 1.5rem; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; height: 2.75rem; padding: 0 1.1rem; border-radius: .625rem;
         font: inherit; font-size: .95rem; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; border: 1.5px solid transparent; transition: background-color .15s, color .15s; }
  .btn.primary { background: var(--olive); color: var(--cream); }
  .btn.primary:hover { background: var(--olive-dark); color: var(--cream); }
  .btn.outline { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.outline:hover { background: var(--paper-deep); color: var(--ink); }
  .btn.violet-outline { background: transparent; color: var(--olive-text); border-color: var(--olive); }
  .btn.violet-outline:hover { background: var(--paper-deep); }
  .btn.danger { background: transparent; color: var(--terracotta); border-color: var(--line); }
  .btn.danger:hover { background: var(--terracotta-tint); color: var(--terracotta); }
  .btn:disabled { opacity: .6; pointer-events: none; }
  .btn:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--moss); outline-offset: 2px; }
  .row-end { display: flex; justify-content: flex-end; }
  .row-start { display: flex; justify-content: flex-start; margin-top: 1.5rem; }
  .round { border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .round.violet { background: var(--paper-deep); color: var(--olive-text); }
  .round.amber { background: var(--brass-tint); color: var(--olive-text); font-weight: 700; font-family: var(--serif); }

  /* home */
  .hero { margin-bottom: 2.5rem; max-width: 48rem; }
  .hero h1 { font-size: 2.35rem; margin-bottom: .75rem; }
  .hero p { font-size: 1.2rem; color: var(--muted); margin-bottom: 1.5rem; }
  .discovery { margin: 3rem 0; }
  .discovery .body { display: flex; align-items: flex-start; }
  .discovery .round { width: 2.5rem; height: 2.5rem; margin-right: 1rem; }
  .discovery h2 { font-size: 1.2rem; }
  .discovery p { color: var(--muted); margin-top: .25rem; }
  .discovery a.more { display: inline-flex; align-items: center; margin-top: .75rem; font-size: .9rem; font-weight: 700; text-decoration: none; color: var(--olive-text); }
  .how { margin-top: 4rem; }
  .how h2, .cta h2 { font-size: 1.6rem; margin-bottom: 1.5rem; color: var(--olive-text); }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
  @media (min-width: 768px) { .steps { grid-template-columns: repeat(3, 1fr); } }
  .steps li { background-color: var(--paper-deep); background-image: repeating-linear-gradient(115deg, var(--hatch) 0 1px, transparent 1px 3px); border-radius: .75rem; padding: 1.25rem; }
  .steps .head { display: flex; align-items: center; margin-bottom: .75rem; }
  .steps .round { width: 2rem; height: 2rem; margin-right: .75rem; }
  .steps h3 { font-size: 1.05rem; }
  .steps p { font-size: .9rem; color: var(--muted); }
  .cta { margin-top: 4rem; text-align: center; }
  .cta .round { width: 3rem; height: 3rem; margin-bottom: 1rem; }
  .cta h2 { margin-bottom: .75rem; }
  .cta p { color: var(--muted); max-width: 36rem; margin: 0 auto 1.5rem; }
  footer { margin-top: 5rem; padding-top: 1.5rem; border-top: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: .5rem;
           font-size: .8rem; color: var(--muted); }
  @media (min-width: 768px) { footer { flex-direction: row; justify-content: center; gap: 1.5rem; } }
  footer a { text-decoration: none; color: var(--muted); }
  footer a:hover { color: var(--olive-text); }

  /* 013: the legal and contact pages, the support links and card */
  .prose { max-width: 42rem; }
  .prose .updated { color: var(--muted); font-size: .875rem; margin-bottom: 1.5rem; }
  .prose h2 { font-size: 1.2rem; color: var(--olive-text); margin: 1.75rem 0 .5rem; }
  .prose p { margin-bottom: .9rem; line-height: 1.6; }
  .prose code { font-size: .9em; background: var(--paper-deep); padding: .1em .35em; border-radius: .3rem; }
  .prose .back { display: inline-block; margin-top: 1rem; }
  .prose .lede { margin-bottom: 1.5rem; }
  .contact-form { display: grid; gap: 1rem; max-width: 30rem; margin-bottom: 1.75rem; }
  .contact-form .field { display: grid; gap: .4rem; }
  .contact-form .field-label { justify-self: start; }
  textarea.text-input { height: auto; padding: .7rem .85rem; resize: vertical; line-height: 1.5; }
  .contact-form .btn { justify-self: start; }
  .contact-form .hint { margin-top: 0; }
  .contact-direct { color: var(--muted); font-size: .9rem; }
  .btn.support { background: var(--terracotta-tint); color: var(--terracotta); border-color: transparent; }
  .btn.support:hover { background: var(--terracotta); color: var(--cream); }
  .btn.small-btn { height: auto; padding: .55rem .9rem; font-size: .875rem; border-radius: .5rem; }
  .drawer-support { margin-top: auto; padding: .75rem; border-top: 1px solid var(--line); }
  .drawer-support .btn { width: 100%; }
  .support-card { margin-top: 3rem; padding: 2rem 1.5rem; text-align: center; border-radius: .75rem;
                  background-color: var(--paper-deep); background-image: repeating-linear-gradient(115deg, var(--hatch) 0 1px, transparent 1px 3px); }
  .support-card h3 { font-size: 1.25rem; margin-bottom: .6rem; color: var(--olive-text); }
  .support-card p { color: var(--muted); max-width: 28rem; margin: 0 auto 1.25rem; font-size: .95rem; line-height: 1.5; }

  /* the stepper */
  .stepper { margin-bottom: 2rem; }
  .stepper .body { padding: 1rem; }
  .stepper .track { max-width: 56rem; margin: 0 auto; }
  .stepper .dots { position: relative; display: flex; justify-content: space-between; align-items: center; }
  .stepper .line, .stepper .fill { position: absolute; top: 50%; transform: translateY(-50%); height: 2px; background: var(--line); width: 100%; }
  .stepper .fill { background: var(--olive); width: 0; transition: width .3s; }
  .stepper[data-step="2"] .fill { width: 50%; }
  .stepper[data-step="3"] .fill { width: 100%; }
  .stepper .dot { position: relative; z-index: 1; width: 2.5rem; height: 2.5rem; border-radius: 9999px; display: flex; align-items: center; justify-content: center;
                  background: var(--paper-deep); color: var(--muted); font-family: var(--serif); font-weight: 600; font-size: .95rem; text-decoration: none; }
  .stepper[data-step="1"] .dot:nth-child(3), .stepper[data-step="2"] .dot:nth-child(3), .stepper[data-step="2"] .dot:nth-child(4),
  .stepper[data-step="3"] .dot { background: var(--olive); color: var(--cream); }
  .stepper .labels { display: flex; justify-content: space-between; margin-top: .5rem; font-size: .75rem; font-weight: 600; color: var(--muted); }
  .stepper .labels div { width: 2.5rem; text-align: center; }
  .step-card .body { padding: 1.5rem; }
  .step-head { margin-bottom: 1.5rem; }
  .step-head h2 { font-size: 1.35rem; margin-bottom: .5rem; }
  .step-head p { color: var(--muted); }

  /* the preferences step */
  .field-label { display: inline-block; padding: 3px 10px; border-top: 1px solid var(--brass); border-bottom: 1px solid var(--brass);
                 font-weight: 700; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--olive-text); margin-bottom: .75rem; }
  .section { margin-bottom: 2rem; }
  .genres { display: grid; grid-template-columns: repeat(2, 1fr); gap: .6rem; }
  @media (min-width: 768px) { .genres { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 1024px) { .genres { grid-template-columns: repeat(4, 1fr); } }
  .genre { display: flex; align-items: center; height: 2.75rem; padding: 0 1rem; font-size: .9rem; font-weight: 500; border: 1.5px solid var(--line); border-radius: .5rem;
           background: var(--paper); color: var(--ink); cursor: pointer; transition: background-color .15s, color .15s; }
  .genre:hover { background: var(--paper-deep); }
  .genre input { position: absolute; opacity: 0; width: 0; height: 0; }
  .genre:has(input:checked) { background: var(--olive); border-color: var(--olive); color: var(--cream); font-weight: 600; }
  .genre:has(input:focus-visible) { outline: 2px solid var(--moss); outline-offset: 2px; }
  .authors-row { display: flex; gap: .6rem; }
  .text-input { flex: 1; height: 2.75rem; padding: 0 .85rem; border: 1.5px solid var(--line); border-radius: .625rem; background: var(--paper-deep); color: var(--ink); font: inherit; font-size: .95rem; width: 100%; }
  .text-input::placeholder { color: var(--muted); font-style: italic; }
  .text-input:focus { outline: 2px solid var(--moss); outline-offset: 0; border-color: transparent; }
  .chips { margin-top: .6rem; display: flex; flex-wrap: wrap; gap: .5rem; }
  .chips:empty { display: none; }
  .chip { background: var(--paper-deep); color: var(--ink); padding: .3rem .8rem; border-radius: 9999px; font-size: .875rem; font-weight: 500; display: inline-flex; align-items: center; gap: .5rem; border: 1.5px solid var(--line); }
  .chip button { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; display: inline-flex; }
  .chip button:hover { color: var(--terracotta); }
  .goodreads { padding: 1.1rem; }
  .goodreads h3 { font-size: 1.1rem; margin-bottom: .25rem; }
  .goodreads > p { font-size: .9rem; color: var(--muted); }
  .gr-note { margin-top: .75rem; padding: .75rem .9rem; background: var(--paper); border: 1px solid var(--line); border-radius: .5rem; display: flex; gap: .5rem; align-items: flex-start; font-size: .875rem; }
  .gr-note svg.i { width: 1rem; height: 1rem; color: var(--brass); margin-top: .125rem; }
  .gr-note .t1 { color: var(--olive-text); font-weight: 700; margin-bottom: .25rem; }
  .gr-note .t2 { color: var(--ink); margin-bottom: .5rem; }
  .gr-note .t2 a { font-weight: 600; }
  .gr-note .t3 { color: var(--muted); font-size: .78rem; }
  .file-input { margin-top: .75rem; display: block; font-size: .875rem; color: var(--muted); }
  .file-input::file-selector-button { margin-right: 1rem; padding: .5rem 1rem; border: 1.5px solid var(--line); border-radius: .5rem; font: inherit; font-size: .875rem; font-weight: 700;
                                      background: var(--paper); color: var(--olive-text); cursor: pointer; }
  .note-ok { margin-top: .5rem; font-size: .875rem; color: var(--olive-text); font-weight: 600; }
  .alert { padding: .75rem 1rem; border-radius: .5rem; margin-bottom: 1.5rem; background: var(--terracotta-tint); border: 1px solid var(--terracotta); color: var(--terracotta); }

  /* the upload step */
  .dropzone { border: 1.5px dashed var(--line); border-radius: .9rem; padding: 1.75rem 1.25rem; margin-bottom: 1.5rem; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
              background-color: var(--paper-deep); background-image: repeating-linear-gradient(115deg, var(--hatch) 0 1px, transparent 1px 3px); }
  .dropzone.over { border-color: var(--olive); }
  .dropzone .round { width: 3rem; height: 3rem; margin-bottom: 1rem; background: var(--paper); color: var(--olive-text); }
  .dropzone h3 { font-size: 1.15rem; margin-bottom: .5rem; }
  .dropzone p { color: var(--muted); margin-bottom: 1rem; max-width: 28rem; }
  .dropzone .choices { display: flex; flex-direction: column; gap: .75rem; }
  @media (min-width: 640px) { .dropzone .choices { flex-direction: row; } }
  .dropzone input[type=file] { display: none; }
  .preview { max-height: 20rem; max-width: 100%; border-radius: .6rem; }
  .tip { text-align: center; margin-bottom: 2rem; color: var(--muted); font-size: .9rem; }
  .tip strong { font-weight: 700; color: var(--ink); }
  .spin { width: 2.5rem; height: 2.5rem; border: 3px solid var(--olive); border-top-color: transparent; border-radius: 9999px; animation: spin 1s linear infinite; margin-bottom: 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .working { padding: 2rem 0; display: flex; flex-direction: column; align-items: center; }
  .working .t1 { color: var(--olive-text); font-weight: 700; margin-bottom: .25rem; }
  .working .t2 { color: var(--muted); }
  .stages { list-style: none; margin: 1rem auto 0; padding: 0; width: 100%; max-width: 28rem; text-align: left; border-top: 1px solid var(--line); }
  .stages li { display: flex; gap: .75rem; align-items: baseline; padding: .7rem 0; border-bottom: 1px solid var(--line); color: var(--muted); }
  .stages .mark { width: 1.25rem; flex: none; text-align: center; }
  .stages .done .mark { color: var(--olive); }
  .stages .active { color: var(--ink); font-weight: 700; } .stages .active .mark { color: var(--moss); animation: pulse 1.4s ease-in-out infinite; }
  .stages .failed { color: var(--terracotta); }
  .stages .note { display: block; font-size: .8rem; font-weight: 400; color: var(--muted); }
  @keyframes pulse { 50% { opacity: .25; } }
  .hint { color: var(--muted); font-size: .875rem; margin-top: .5rem; }
  .error { padding: .9rem 1rem; border-radius: .6rem; background: var(--terracotta-tint); border: 1px solid var(--terracotta); color: var(--ink); }
  .error strong { display: block; color: var(--terracotta); font-family: var(--serif); }
  .retry { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin-top: .75rem; }

  /* the recommendations */
  .recs-head h3 { font-size: 1.35rem; margin-bottom: .5rem; }
  .recs-head p { color: var(--muted); margin-bottom: 1.25rem; }
  .recs-title { font-size: 1.3rem; margin-bottom: 1rem; color: var(--olive-text); }
  .picks { list-style: none; margin: 0; padding: 0; display: grid; gap: 1rem; }
  .pick { background-color: var(--paper-deep); background-image: repeating-linear-gradient(115deg, var(--hatch) 0 1px, transparent 1px 3px); border-radius: .75rem; overflow: hidden; }
  .pick .cover-col { padding: 1.1rem; display: flex; }
  .pick .cover, .cover-ph { width: 6rem; height: 9rem; border-radius: .4rem; object-fit: cover; flex: none; box-shadow: 0 1px 2px rgba(43,38,32,.15); }
  .cover-ph { background: linear-gradient(135deg, var(--paper), var(--line)); display: flex; align-items: center; justify-content: center; color: var(--olive-text); }
  .pick .text-col { display: flex; flex-direction: column; }
  .pick .text { padding: 1.1rem 1.1rem .5rem; }
  .pick h4, .pick-title { font-size: 1.15rem; margin-bottom: .2rem; display: block; }
  .pick .by { font-size: .85rem; margin-bottom: .6rem; color: var(--muted); }
  .why { margin: .4rem 0 .6rem; padding: .7rem .85rem; font-size: .9rem; border-radius: .5rem; background: var(--paper); border: 1px solid var(--line); }
  .why .t1 { color: var(--olive-text); font-weight: 700; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; margin-bottom: .3rem; }
  .why .t2 { color: var(--muted); }
  .pick .actions { margin-top: auto; padding: .6rem 1.1rem 1.1rem; display: flex; justify-content: space-between; gap: .75rem; }
  .pick-actions { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; width: 100%; }
  .btn.save { height: auto; padding: .55rem .9rem; font-size: .875rem; border-radius: .5rem; background: var(--moss); color: var(--cream); border-color: transparent; }
  .btn.save:hover { background: var(--olive); color: var(--cream); }
  .btn.save.saved { background: var(--olive-dark); color: var(--cream); }
  .btn.notme { height: auto; padding: .55rem .9rem; font-size: .875rem; border-radius: .5rem; background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.notme:hover { background: var(--paper); color: var(--ink); }
  .marked { color: var(--muted); font-size: .85rem; }
  @media (min-width: 768px) {
    .pick { display: flex; }
    .pick .cover-col { flex-direction: column; align-items: center; width: 25%; border-right: 1px solid var(--line); }
    .pick .cover, .cover-ph { width: 8rem; height: 12rem; }
    .pick .text-col { width: 75%; }
  }
  .all-titles { margin-top: 1.25rem; color: var(--muted); font-size: .9rem; }
  .all-titles summary { cursor: pointer; }
  .titles { padding-left: 1.25rem; margin: .5rem 0 0; }
  .titles li { padding: .2rem 0; }
  .empty-result { text-align: center; padding: 2.5rem 0; color: var(--muted); }
  .empty-result svg.i { width: 3rem; height: 3rem; color: var(--sage); margin: 0 auto 1rem; }
  .uploading { color: var(--muted); }

  /* the reading list */
  .list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; gap: 1rem; }
  .empty-state { text-align: center; padding: 4rem 2rem; background-color: var(--paper-deep); background-image: repeating-linear-gradient(115deg, var(--hatch) 0 1px, transparent 1px 3px); border-radius: .75rem; }
  .empty-state svg.i { width: 4.5rem; height: 4.5rem; color: var(--sage); stroke-width: 1.3; margin: 0 auto 1rem; }
  .empty-state h2 { font-size: 1.3rem; margin-bottom: .5rem; }
  .empty-state p { color: var(--muted); margin-bottom: 1.5rem; }
  .saved-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr; gap: 1rem; }
  @media (min-width: 768px) { .saved-list { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1024px) { .saved-list { grid-template-columns: repeat(3, 1fr); } }
  .saved-pick { background-color: var(--paper-deep); background-image: repeating-linear-gradient(115deg, var(--hatch) 0 1px, transparent 1px 3px); border-radius: .75rem; overflow: hidden; display: flex; flex-direction: column; }
  .saved-pick .top { padding: 1.1rem; display: flex; }
  .saved-pick .cover, .saved-pick .cover-ph { width: 5.5rem; height: 8.25rem; }
  .saved-pick .meta { margin-left: 1rem; flex: 1; }
  .saved-pick h3 { font-size: 1.1rem; }
  .saved-pick .by { color: var(--muted); font-size: .85rem; margin-top: .2rem; }
  .saved-pick .date { display: inline-block; margin-top: .6rem; padding: 2px 9px; border-top: 1px solid var(--brass); border-bottom: 1px solid var(--brass);
                      font-weight: 700; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--olive-text); }
  .saved-pick .bottom { padding: 1rem 1.1rem 1.1rem; border-top: 1px solid var(--line); font-size: .9rem; color: var(--muted); flex: 1; display: flex; flex-direction: column; }
  .saved-pick .bottom .row-end { margin-top: auto; padding-top: 1rem; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .clamp.open { display: block; }
  .read-more { margin-top: .5rem; background: none; border: 0; padding: 0; color: var(--olive-text); font: inherit; font-size: .875rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: .25rem; }
  @media (prefers-reduced-motion: reduce) { .spin, .stages .active .mark { animation: none; } aside.drawer { transition: none; } }
</style>
<script src="/static/htmx.min.js"></script>
<script src="/static/sse.js"></script>
</head>
<body>
<header>
  <div class="bar">
    <div class="left">
      <button type="button" class="icon-btn" id="menu-toggle" aria-label="Menu" aria-controls="drawer" aria-expanded="false">
        <svg class="i" viewBox="0 0 24 24"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      </button>
      <a class="brand" href="/">
        <svg class="i" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
        <span>ShelfScanner</span>
      </a>
    </div>
    <div class="right">
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode">
        <svg class="i moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg class="i sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <span class="label"><span class="to-dark">Dark</span><span class="to-light">Light</span></span>
      </button>
      <a class="icon-btn" href="/contact" {% if page == 'contact' %}aria-current="page"{% endif %}>
        <svg class="i" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        <span class="label">Contact</span>
      </a>
    </div>
  </div>
</header>
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <nav aria-label="Main">
    <ul>
      <li><a href="/" {% if page == 'home' %}aria-current="page"{% endif %}>
        <svg class="i s" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span></a></li>
      <li><a href="/books" {% if page == 'books' %}aria-current="page"{% endif %}>
        <svg class="i s" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg><span>Book Scanner</span></a></li>
      <li><a href="/reading-list" {% if page == 'reading-list' %}aria-current="page"{% endif %}>
        <svg class="i s" viewBox="0 0 24 24"><path d="M17 3H7a2 2 0 0 0-2 2v16l7-3 7 3V5a2 2 0 0 0-2-2z"/></svg><span>Reading List</span></a></li>
    </ul>
  </nav>
  <div class="drawer-support">
    <a class="btn support small-btn" href="{{ donate_url }}" target="_blank" rel="noopener noreferrer">
      <svg class="i s" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>Support ShelfScanner</a>
  </div>
</aside>
<main>
  {% block content %}{% endblock %}
  <footer>
    <span>© {{ year }} ShelfScanner. All rights reserved.</span>
    <a href="/privacy-policy">Privacy Policy</a>
    <a href="/terms-conditions">Terms &amp; Conditions</a>
    <a href="/contact">Contact</a>
    <a href="{{ donate_url }}" target="_blank" rel="noopener noreferrer">Support ShelfScanner</a>
  </footer>
</main>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
